<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ansh Bridal Mehandi Art</title>
    <script>
      // GitHub Pages SPA 404 redirect handler
      var path = window.location.pathname;
      var repo = path.split('/')[1];
      if (repo && window.location.hostname.endsWith('github.io')) {
        window.location.replace('/' + repo + '/');
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Ansh Bridal Mehandi Art...</p>
  </body>
</html>
